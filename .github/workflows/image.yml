name: image
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Освободить место на раннере (базовый образ PyTorch большой)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost \
                      /usr/lib/jvm /usr/share/swift /opt/microsoft /opt/google /usr/local/share/powershell /usr/local/share/chromium
          docker system prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/marinabarz/ghostgen:v3
            ghcr.io/marinabarz/ghostgen:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/MarinaBarz/ghostgen
